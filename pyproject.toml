[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwenlean"
version = "0.1.0"
description = "Measure and reduce redundant reasoning without sacrificing accuracy"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["mlx-lm>=0.31", "PyYAML>=6", "psutil>=7", "numpy>=2", "matplotlib>=3.10"]

[project.optional-dependencies]
compat = ["torch>=2.8", "peft>=0.18", "trl>=0.24"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
qwenlean = "qwenlean.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
